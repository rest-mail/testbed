name: lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  taskfile:
    name: taskfile syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Taskfile.yml
        run: task --list-all

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install --user yamllint
      - name: Lint yaml
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable, comments: disable, document-start: disable, truthy: {check-keys: false}}}" \
            Taskfile.yml .github/workflows/

  fixture:
    name: fixture template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: Pack and test the fixture template
        run: scripts/fixture-test.sh
