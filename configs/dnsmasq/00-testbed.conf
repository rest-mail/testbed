# testbed-static dnsmasq fragment.
#
# Loaded by reference-dnsmasq via --conf-dir=/etc/dnsmasq-overlay/.
# This file holds only facts that belong to the testbed itself: the upstream
# DNS forwarders so peers using us as their resolver can still reach the
# outside world (apt, npm, etc.).
#
# Everything else — *.test mail hosts, postgres-mailN, api, clamav, rspamd,
# autoconfig/autodiscover/mta-sts, MX/SRV/PTR/SPF/DMARC/MTA-STS/TLS-RPT —
# is owned by the consumer that brings up the corresponding container, and
# is registered as a fragment by that consumer:
#
#   docker run --rm \
#     -v testbed_dnsmasq_fragments:/dst \
#     -v ./fragment.conf:/src.conf:ro \
#     alpine:3.20 cp /src.conf /dst/10-<name>.conf
#   docker restart testbed-dnsmasq
#
# Consumers remove their fragment + reload at teardown. Shared singletons
# (clamav, rspamd) follow the first-mover-creates pattern: the first
# consumer that needs the singleton starts it and writes its fragment;
# later consumers detect the container by name and skip.

# ── Upstream DNS for non-.test queries (apt, npm, etc. inside peers) ─
server=8.8.8.8
server=8.8.4.4
