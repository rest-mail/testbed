version: "3"

# rest-mail/testbed — Taskfile
#
# Pure substrate: shared mailnet network, certs volume, dnsmasq fragments
# volume. Per-service lifecycle (the dnsmasq container itself) lives in
# tasks/<service>.yml and is pulled in via the `includes:` block below.
# Everything is driven from task — no docker-compose. Resource names are
# derived from PROJECT so they remain the contract for consumers joining
# mailnet by name.
#
# certgen, clamav, and rspamd are not in the testbed: consumers
# (rest-mail-server, reference-mailserver) issue certs on demand and
# bring up clamav/rspamd as part of their own start chain. First mover
# creates the shared container; later consumers detect it by name and
# skip (dev-env shared-tenant pattern).
#
# Output is friendly by default. Re-run with VERBOSE=1 to see the raw
# docker / shell output (e.g. VERBOSE=1 task up).

silent: true

vars:
  PROJECT: '{{.PROJECT | default "testbed"}}'
  NETWORK: '{{.PROJECT}}_mailnet'
  CERTS_VOLUME: '{{.PROJECT}}_certs'
  DNSMASQ_FRAGMENTS_VOLUME: '{{.PROJECT}}_dnsmasq_fragments'
  SUBNET: 10.99.0.0/16
  DNS_IP: 10.99.0.10
  IMAGE_TAG: '{{.IMAGE_TAG | default "0.1.0"}}'
  DNSMASQ_NAME: '{{.PROJECT}}-dnsmasq'
  # Uniquely named and passed explicitly to the include below: tasks/dnsmasq.yml
  # declares a self-referencing `IMAGE` var, and when THIS taskfile is included
  # by a parent (rest-mail), Task flattens all vars into one namespace — a bare
  # unpassed IMAGE resolves to the parent's (empty) value and the image ref
  # renders as ":<tag>", so dnsmasq:up dies with "invalid reference format".
  DNSMASQ_IMAGE: '{{.DNSMASQ_IMAGE | default "ghcr.io/rest-mail/reference-dnsmasq"}}'

# ════════════════════════════════════════════════════════
# Includes
#
# Per-service Taskfiles under tasks/ expose up/down/restart/reload/reap/
# logs/ps for a single container. Vars from the substrate vars block
# above are passed in so naming stays consistent with PROJECT.
# ════════════════════════════════════════════════════════
includes:
  dnsmasq:
    taskfile: ./tasks/dnsmasq.yml
    vars:
      PROJECT: '{{.PROJECT}}'
      NETWORK: '{{.NETWORK}}'
      IP: '{{.DNS_IP}}'
      IMAGE: '{{.DNSMASQ_IMAGE}}'
      IMAGE_TAG: '{{.IMAGE_TAG}}'
      FRAGMENTS_VOLUME: '{{.DNSMASQ_FRAGMENTS_VOLUME}}'

tasks:

  # ════════════════════════════════════════════════════════
  # bootstrap / up / down
  # ════════════════════════════════════════════════════════

  bootstrap:
    desc: Create mailnet network, certs volume, dnsmasq fragments volume (idempotent)
    run: once
    cmds:
      - |
        if docker network inspect {{.NETWORK}} >/dev/null 2>&1; then
          [ -n "$VERBOSE" ] && echo "  network {{.NETWORK}} already exists" || true
        else
          echo "  creating network {{.NETWORK}} ({{.SUBNET}})"
          if [ -n "$VERBOSE" ]; then
            docker network create --subnet={{.SUBNET}} {{.NETWORK}}
          else
            docker network create --subnet={{.SUBNET}} {{.NETWORK}} >/dev/null
          fi
        fi
      - |
        if docker volume inspect {{.CERTS_VOLUME}} >/dev/null 2>&1; then
          [ -n "$VERBOSE" ] && echo "  volume {{.CERTS_VOLUME}} already exists" || true
        else
          echo "  creating volume {{.CERTS_VOLUME}}"
          if [ -n "$VERBOSE" ]; then
            docker volume create {{.CERTS_VOLUME}}
          else
            docker volume create {{.CERTS_VOLUME}} >/dev/null
          fi
        fi
      - |
        if docker volume inspect {{.DNSMASQ_FRAGMENTS_VOLUME}} >/dev/null 2>&1; then
          [ -n "$VERBOSE" ] && echo "  volume {{.DNSMASQ_FRAGMENTS_VOLUME}} already exists" || true
        else
          echo "  creating volume {{.DNSMASQ_FRAGMENTS_VOLUME}}"
          if [ -n "$VERBOSE" ]; then
            docker volume create {{.DNSMASQ_FRAGMENTS_VOLUME}}
          else
            docker volume create {{.DNSMASQ_FRAGMENTS_VOLUME}} >/dev/null
          fi
        fi
      # Refresh the testbed-static fragment in the volume on every bootstrap
      # so edits to configs/dnsmasq/00-testbed.conf are picked up next reload.
      - |
        echo "  seeding 00-testbed.conf into {{.DNSMASQ_FRAGMENTS_VOLUME}}"
        docker run --rm \
          -v "{{.DNSMASQ_FRAGMENTS_VOLUME}}:/dst" \
          -v "$(pwd)/configs/dnsmasq:/src:ro" \
          alpine:3.20 cp /src/00-testbed.conf /dst/00-testbed.conf >/dev/null

  check:
    desc: Verify the testbed is running (network + certs volume present)
    run: once
    cmds:
      - |
        if ! docker network inspect {{.NETWORK}} >/dev/null 2>&1; then
          echo "ERROR testbed network '{{.NETWORK}}' not found." >&2
          echo "Bring up the testbed first:" >&2
          echo "  task testbed:up" >&2
          exit 1
        fi
        if ! docker volume inspect {{.CERTS_VOLUME}} >/dev/null 2>&1; then
          echo "ERROR testbed certs volume '{{.CERTS_VOLUME}}' not found." >&2
          echo "Run 'task testbed:up' to create it." >&2
          exit 1
        fi

  clean:orphans:
    desc: Remove legacy testbed containers from previous compose-era layouts
    run: once
    cmds:
      - |
        managed="{{.DNSMASQ_NAME}}"
        ids=$(docker ps -aq --filter "name=^/{{.PROJECT}}-")
        removed=0
        for id in $ids; do
          name=$(docker inspect --format '{{`{{.Name}}`}}' "$id" | sed 's|^/||')
          case " $managed " in
            *" $name "*) ;;
            *)
              echo "  removing orphan: $name"
              if [ -n "$VERBOSE" ]; then
                docker rm -f "$id"
              else
                docker rm -f "$id" >/dev/null
              fi
              removed=$((removed+1))
              ;;
          esac
        done
        if [ "$removed" = 0 ] && [ -n "$VERBOSE" ]; then
          echo "  no orphan containers"
        fi

  up:
    desc: Bring up the testbed (network + certs volume + dnsmasq)
    deps: [bootstrap, clean:orphans]
    cmds:
      - task: dnsmasq:reap
      - task: dnsmasq:up
      - |
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  testbed ready"
        echo ""
        echo "  Network   →  {{.NETWORK}}  ({{.SUBNET}})"
        echo "  DNS       →  {{.DNS_IP}}  (configure peers with dns: [{{.DNS_IP}}])"
        echo "  Certs vol →  {{.CERTS_VOLUME}}  (consumers issue certs on demand)"
        echo ""
        echo "  task ca:fetch       copy ca.crt to ./ca.crt (after a consumer has issued one)"
        echo "  task ps             show testbed container status"
        echo "  task dnsmasq:logs   tail dnsmasq logs"
        echo "  task down           stop testbed containers (preserves volume + network)"
        echo "  task down:clean     stop + remove network + certs volume"
        echo "  VERBOSE=1 task ...  raw docker output"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  down:
    desc: Stop and remove testbed containers (preserves the certs volume + network)
    cmds:
      - task: dnsmasq:down

  down:clean:
    desc: Stop containers and remove network + certs volume + dnsmasq fragments (destructive)
    cmds:
      - task: down
      - |
        if docker network inspect {{.NETWORK}} >/dev/null 2>&1; then
          echo "  removing network {{.NETWORK}}"
          if [ -n "$VERBOSE" ]; then
            docker network rm {{.NETWORK}}
          else
            docker network rm {{.NETWORK}} >/dev/null
          fi
        fi
      - |
        if docker volume inspect {{.CERTS_VOLUME}} >/dev/null 2>&1; then
          echo "  removing volume {{.CERTS_VOLUME}}"
          if [ -n "$VERBOSE" ]; then
            docker volume rm -f {{.CERTS_VOLUME}}
          else
            docker volume rm -f {{.CERTS_VOLUME}} >/dev/null
          fi
        fi
      - |
        if docker volume inspect {{.DNSMASQ_FRAGMENTS_VOLUME}} >/dev/null 2>&1; then
          echo "  removing volume {{.DNSMASQ_FRAGMENTS_VOLUME}}"
          if [ -n "$VERBOSE" ]; then
            docker volume rm -f {{.DNSMASQ_FRAGMENTS_VOLUME}}
          else
            docker volume rm -f {{.DNSMASQ_FRAGMENTS_VOLUME}} >/dev/null
          fi
        fi

  # ════════════════════════════════════════════════════════
  # CA cert export
  # ════════════════════════════════════════════════════════

  ca:fetch:
    desc: Copy ca.crt out of the certs volume to ./ca.crt (requires a consumer to have issued at least one cert)
    cmds:
      - |
        if ! docker run --rm -v "{{.CERTS_VOLUME}}:/certs:ro" alpine:3.20 test -f /certs/ca.crt; then
          echo "ERROR ca.crt not present in {{.CERTS_VOLUME}}." >&2
          echo "Bring up a consumer (e.g. task mailserver:mail1:up in rest-mail-server) so it issues its first cert." >&2
          exit 1
        fi
      - docker run --rm -v "{{.CERTS_VOLUME}}:/certs:ro" -v "$(pwd):/out" alpine:3.20 cp /certs/ca.crt /out/ca.crt
      - echo "Wrote ./ca.crt"
      - openssl x509 -in ./ca.crt -noout -subject -issuer -dates

  ca:show:
    desc: Print the CA cert details without copying it out
    cmds:
      - |
        docker run --rm -v "{{.CERTS_VOLUME}}:/certs:ro" alpine:3.20 \
          sh -c "apk add --no-cache openssl >/dev/null 2>&1 && openssl x509 -in /certs/ca.crt -text -noout"

  # ════════════════════════════════════════════════════════
  # Diagnostics
  # ════════════════════════════════════════════════════════

  ps:
    desc: Show testbed container status
    cmds:
      - task: dnsmasq:ps

  dig:
    desc: 'Run a dig query against testbed dnsmasq from inside mailnet. Usage: task dig -- mail1.test [MX|SRV|TXT|...]'
    cmds:
      - |
        docker run --rm --network {{.NETWORK}} alpine:3.20 sh -c \
          "apk add --no-cache bind-tools >/dev/null 2>&1 && dig @{{.DNS_IP}} {{.CLI_ARGS}}"

  # ════════════════════════════════════════════════════════
  # Smoke test
  # ════════════════════════════════════════════════════════

  smoke:
    desc: Verify the testbed is healthy (dnsmasq running + upstream forwarding works)
    cmds:
      - |
        echo "1/2 dnsmasq is running ..."
        if ! docker ps --filter "name=^/{{.DNSMASQ_NAME}}$" --filter "status=running" -q | grep -q .; then
          echo "FAIL {{.DNSMASQ_NAME}} not running"; exit 1
        fi
        echo "  -> running"
      - |
        echo "2/2 dnsmasq forwards upstream queries ..."
        result=$(docker run --rm --network {{.NETWORK}} alpine:3.20 sh -c \
          "apk add --no-cache bind-tools >/dev/null 2>&1 && dig @{{.DNS_IP}} dns.google +short +time=2 +tries=1 | head -1")
        echo "  -> $result"
        echo "$result" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' || { echo "FAIL upstream DNS not resolving"; exit 1; }
      - echo "OK testbed smoke test passed (per-consumer records appear once consumers register)"
